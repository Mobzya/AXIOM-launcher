name: AXIOM Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: axiom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install compile platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests and both APK builds
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AXIOM-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload optimized signed performance APK
        uses: actions/upload-artifact@v4
        with:
          name: AXIOM-optimized-test-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
